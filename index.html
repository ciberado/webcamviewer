<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam view</title>

    <style>
        body, html, video {
            margin: 0;
            padding: 0;
        }
        video {
            width: 100%;
            max-width: 100%;
        }
        #device-menu {
            position: fixed;
            z-index: 1;
            padding: 12px;
            background: white;
            border: 1px solid #888;
            box-shadow: 0 2px 8px #0004;
        }
        #device-menu label {
            display: block;
            margin-bottom: 8px;
        }
        #device-menu label:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <video autoplay id="vid"></video>
    <div id="device-menu" hidden>
        <label>
            Camera
            <select id="camera-select"></select>
        </label>
        <label>
            Microphone
            <select id="microphone-select"></select>
        </label>
        <label>
            <input id="autofocus-checkbox" type="checkbox" checked>
            Autofocus
        </label>
        <label>
            Rotation
            <select id="rotation-select">
                <option value="0">0°</option>
                <option value="90">90°</option>
                <option value="180">180°</option>
                <option value="270">270°</option>
            </select>
        </label>
        <label>
            <input id="mirror-checkbox" type="checkbox">
            Mirror
        </label>
    </div>
    
    <script type="text/javascript">
        var video = document.querySelector("#vid");
        var deviceMenu = document.querySelector("#device-menu");
        var cameraSelect = document.querySelector("#camera-select");
        var microphoneSelect = document.querySelector("#microphone-select");
        var autofocusCheckbox = document.querySelector("#autofocus-checkbox");
        var rotationSelect = document.querySelector("#rotation-select");
        var mirrorCheckbox = document.querySelector("#mirror-checkbox");
        var selectedCamera;
        var selectedMicrophone;
        var autofocusEnabled = true;
        var currentStream;
        var requestNumber = 0;

        function updateViewTransform() {
            video.style.transform = "rotate(" + rotationSelect.value + "deg) scaleX(" + (mirrorCheckbox.checked ? -1 : 1) + ")";
        }

        function getConstraints() {
            return {
                audio: selectedMicrophone ? {deviceId: {exact: selectedMicrophone}} : true,
                video: {
                    ...(selectedCamera ? {deviceId: {exact: selectedCamera}} : {}),
                    width: {min: 1920, max: 1920 * 2},
                    height: {min: 1080, max: 1080 * 2}
                }
            };
        }

        function startStream() {
            var thisRequest = ++requestNumber;
            navigator.mediaDevices.getUserMedia(getConstraints())
                .then(function(stream) {
                    if (thisRequest !== requestNumber) {
                        stream.getTracks().forEach(function(track) { track.stop(); });
                        return;
                    }
                    var previousStream = currentStream;
                    currentStream = stream;
                    video.srcObject = stream;
                    setAutofocusSupport(stream.getVideoTracks()[0]);
                    if (previousStream) {
                        previousStream.getTracks().forEach(function(track) { track.stop(); });
                    }
                    updateDeviceOptions();
                })
                .catch(function(error) {
                    if (thisRequest === requestNumber) {
                        console.error(error);
                    }
                });
        }

        function setAutofocusSupport(track) {
            var capabilities = track.getCapabilities ? track.getCapabilities() : {};
            var focusModes = capabilities.focusMode || [];
            var focusMode = autofocusEnabled ? "continuous" : "manual";
            autofocusCheckbox.checked = autofocusEnabled;
            autofocusCheckbox.disabled = !focusModes.includes("continuous") || !focusModes.includes("manual");
            if (!autofocusCheckbox.disabled) {
                track.applyConstraints({advanced: [{focusMode: focusMode}]}).catch(function(error) {
                    console.error(error);
                });
            }
        }

        function updateDeviceOptions() {
            return navigator.mediaDevices.enumerateDevices().then(function(devices) {
                [
                    {select: cameraSelect, kind: "videoinput", selected: selectedCamera},
                    {select: microphoneSelect, kind: "audioinput", selected: selectedMicrophone}
                ].forEach(function(input) {
                    var devicesOfKind = devices.filter(function(device) {
                        return device.kind === input.kind;
                    });
                    input.select.replaceChildren(new Option("Default", ""));
                    devicesOfKind.forEach(function(device, index) {
                        var fallbackLabel = input.select === cameraSelect ? "Camera " : "Microphone ";
                        var option = new Option(device.label || fallbackLabel + (index + 1), device.deviceId);
                        input.select.add(option);
                    });
                    input.select.value = input.selected || "";
                });
            }).catch(function(error) {
                console.error(error);
            });
        }

        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
            deviceMenu.hidden = false;
            var bounds = deviceMenu.getBoundingClientRect();
            deviceMenu.style.left = Math.min(event.clientX, window.innerWidth - bounds.width) + "px";
            deviceMenu.style.top = Math.min(event.clientY, window.innerHeight - bounds.height) + "px";
        });

        document.addEventListener("click", function(event) {
            if (!deviceMenu.contains(event.target)) {
                deviceMenu.hidden = true;
            }
        });

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                deviceMenu.hidden = true;
            }
        });

        cameraSelect.addEventListener("change", function() {
            selectedCamera = cameraSelect.value || undefined;
            startStream();
        });

        microphoneSelect.addEventListener("change", function() {
            selectedMicrophone = microphoneSelect.value || undefined;
            startStream();
        });

        autofocusCheckbox.addEventListener("change", function() {
            autofocusEnabled = autofocusCheckbox.checked;
            var track = currentStream && currentStream.getVideoTracks()[0];
            if (track) {
                setAutofocusSupport(track);
            }
        });

        rotationSelect.addEventListener("change", updateViewTransform);
        mirrorCheckbox.addEventListener("change", updateViewTransform);

        updateViewTransform();
        startStream();
        navigator.mediaDevices.addEventListener("devicechange", updateDeviceOptions);
        updateDeviceOptions();
    </script>
    
</body>
</html>
